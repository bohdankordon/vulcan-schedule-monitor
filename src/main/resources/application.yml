spring:
  application:
    name: vulcan-schedule-monitor
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

vulcan:
  monitoring:
    enabled: false
    poll-interval: PT5M
  connection:
    enabled: false
    public-base-url: ""
    token-ttl: PT10M
    max-credential-attempts: 5
    master-key: ${VULCAN_MASTER_KEY:}
    playwright-headless: true

telegram:
  bot:
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN:}
  dispatch:
    interval: PT2S
    initial-delay: PT2S
