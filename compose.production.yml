services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    # Official binary has cap_net_bind_service=ep; removing it from the bounding
    # set causes exec EPERM even on high ports. No custom image/setcap mutation.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      EDGE_HTTPS_PORT: ${EDGE_HTTPS_PORT:-8443}
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTP_PORT:-8080}:8080"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTPS_PORT:-8443}:8443"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTPS_PORT:-8443}:8443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: ./docker/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:-vulcan-schedule-monitor:production}
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      # Playwright Java extracts and executes its bundled Node driver here.
      - /tmp:rw,nosuid,nodev,exec,size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        gw_priority: 1
      backend: {}
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schedule_monitor
      SPRING_DATASOURCE_USERNAME: schedule_monitor
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the untracked environment file}
      VULCAN_MASTER_KEY: ${VULCAN_MASTER_KEY:?Set VULCAN_MASTER_KEY to a stable Base64 encoded 32-byte key}
      VULCAN_CONNECTION_ENABLED: ${VULCAN_CONNECTION_ENABLED:-false}
      VULCAN_MONITORING_ENABLED: ${VULCAN_MONITORING_ENABLED:-false}
      VULCAN_CONNECTION_PUBLICBASEURL: ${PUBLIC_BASE_URL:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.6
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: schedule_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the untracked environment file}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the untracked environment file}
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./docker/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
